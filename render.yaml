services:
  - type: web
    name: blog-full-stack-training-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix backend --include=dev && npm --prefix backend run build
    startCommand: npm --prefix backend run db:schema && npm --prefix backend run db:seed && npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blog-full-stack-training-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: blog-full-stack-training-db
    plan: free
    region: singapore
    databaseName: blog_db
    user: blog_user
    ipAllowList: []
